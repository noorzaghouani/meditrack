{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Changer le mot de passe</h1><p>12 caractères minimum, avec au moins 3 types de caractères.</p></div></div>
<div class="card narrow">
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Mot de passe actuel<input type="password" name="current" autocomplete="current-password" required></label>
    <label>Nouveau mot de passe<input type="password" name="new" autocomplete="new-password" required></label>
    <label>Confirmation<input type="password" name="confirm" autocomplete="new-password" required></label>
    <div class="form-actions">
      <button class="btn" type="submit">Enregistrer</button>
      <a class="btn ghost" href="{{ url_for('dashboard') }}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
