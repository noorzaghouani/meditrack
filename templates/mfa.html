{% extends "auth.html" %}
{% block auth_content %}
<h1>Vérification en deux étapes</h1>
<p class="sub">Un code à 6 chiffres a été envoyé à <b>{{ email }}</b>. Il est valable {{ ttl }} minutes.</p>
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Code de vérification
    <input class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" autofocus required>
  </label>
  <button class="btn block" type="submit">Valider</button>
</form>
<form method="post" action="{{ url_for('mfa_resend') }}" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <button class="btn ghost block" type="submit">Renvoyer un code</button>
</form>
<p class="hint"><a href="{{ url_for('login') }}">Retour à la connexion</a></p>
{% endblock %}
