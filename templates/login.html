{% extends "auth.html" %}
{% block auth_content %}
<h1>Connexion</h1>
<p class="sub">Accédez à votre espace sécurisé.</p>
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Identifiant
    <input name="username" autocomplete="username" autofocus required>
  </label>
  <label>Mot de passe
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="btn block" type="submit">Se connecter</button>
</form>
{% if cognito_enabled %}
<div style="display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:13px;">
  <hr style="flex:1;border:none;border-top:1px solid var(--line);">
  ou
  <hr style="flex:1;border:none;border-top:1px solid var(--line);">
</div>
<a class="btn ghost block" href="{{ url_for('cognito_login') }}"
   style="display:flex;align-items:center;justify-content:center;gap:10px;">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  Se connecter avec AWS Cognito
</a>
{% endif %}
{% endblock %}
